</style><main><h1>无限的一隅</h1><p class="intro">写下一句话，经过SHA-256 哈希，利用 de Bruijn 五重网格算法生成彭罗斯密铺图案。这个图形是一个无限延伸、无周期性世界的一部分，也许只有这句话能找到它。</p><form class="entry" id="phraseForm"><input id="phrase" value="" placeholder="天地本宽，而鄙者自隘"><button class="primary" id="generate" type="submit">生成</button></form><div class="layout"><div class="art"><canvas id="canvas"></canvas><div class="status" id="status">生成中</div><div class="history-controls"><button id="undo" title="撤销上一次修改">↶ 撤销</button><button id="redo" title="重做上一次修改">↷ 重做</button></div><div class="zoom-controls"><button id="minus" title="缩小">−</button><button id="plus" title="放大">+</button></div></div><aside class="side"><div class="head">密铺范围</div><div class="range-head"><span class="muted">范围层级</span><b id="levelText">12</b></div><input id="level" type="range" min="5" max="30" value="12" step="1"><div class="muted">5 — 30 · 调整后自动居中适配</div><div class="head">菱形颜色</div><div class="colors"><label>厚菱形<input type="color" id="thick" value="#d8b58d"></label><label>薄菱形<input type="color" id="thin" value="#88aaa2"></label></div><button id="seedColors">↺ 重置为原始配色</button><button id="randomColors">⤨ 随机颜色</button><div class="head">边界</div><label><input type="radio" name="edge" value="none"> 无边界</label><label><input type="radio" name="edge" value="line" checked> 显示边界</label><div class="head">导出</div><button id="png">↓ 导出图像 PNG</button><button id="svg">↓ 导出 SVG（嵌入图像）</button><button id="hashButton">↓ 导出哈希值</button><div class="head">SHA-256</div><div id="hash" class="hash">—</div><div class="head">视角</div><button id="reset">重置视角</button><div class="foot">右下角 + / − 缩放，画面自动居中</div></aside></div></main><script>
const $=x=>document.getElementById(x),c=$('canvas'),g=c.getContext('2d'),V=Array.from({length:5},(_,i)=>[Math.cos(2*Math.PI*i/5),Math.sin(2*Math.PI*i/5)]);let fillMode=false,fillExtent=0;const MAX_FILL_RADIUS=75;let phase=[],tiles=[],hash='',level=12,mode='line',scale=20,offset=[0,0],palette=['#d8b58d','#88aaa2'],history=[],historyIndex=-1,restoring=false,hashBytes=[];const cross=(a,b)=>a[0]*b[1]-a[1]*b[0];function point(k){let x=0,y=0;for(let j=0;j<5;j++){x+=k[j]*V[j][0];y+=k[j]*V[j][1]}return[x,y]}

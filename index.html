<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无限的一隅</title><style>body{margin:0;background:white;color:#222;font:15px system-ui}main{max-width:1180px;margin:35px auto;padding:0 20px}h1{font-weight:550;font-size:32px}p,.muted{color:#777}.entry{display:flex;gap:10px;margin:25px 0}.entry input{flex:1;min-width:0;padding:14px;border:1px solid #ddd;border-radius:9px;font:inherit}button{padding:11px 15px;background:white;border:1px solid #ddd;border-radius:9px;cursor:pointer;font:inherit}button:disabled{opacity:.4}.primary{background:#222;color:white;padding:12px 30px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px}.art{height:640px;background:#fff;border:1px solid #eee;border-radius:12px;position:relative;overflow:hidden}canvas{width:100%;height:100%;touch-action:pan-y}.history-controls{position:absolute;top:14px;right:14px;display:flex;gap:7px;z-index:2}.history-controls button{padding:8px 12px;background:#ffffffee;box-shadow:0 2px 9px #0001;font-size:13px}.zoom-controls{position:absolute;right:15px;bottom:15px;display:flex;gap:6px}.zoom-controls button{width:39px;height:39px;padding:0;font-size:23px;background:#ffffffeb;box-shadow:0 2px 8px #0001}.colors{display:grid;grid-template-columns:1fr 1fr;gap:12px}.colors label{font-size:12px;color:#666}.colors input{display:block;width:100%;height:38px;padding:2px;border:1px solid #ddd;border-radius:6px;background:white}.range-head{display:flex;justify-content:space-between;align-items:center}.range-head b{font-size:19px}.side input[type=range]{width:100%;accent-color:#333}.undo{display:flex;gap:8px}.undo button{flex:1;text-align:center}.status{position:absolute;bottom:15px;left:15px;background:#ffffffd9;padding:8px;border-radius:6px;font-size:12px;color:#666;pointer-events:none}.side{border:1px solid #eee;border-radius:12px;padding:18px;align-self:start}.side button{width:100%;text-align:left;margin:5px 0}.head{font-size:12px;color:#888;margin:20px 0 10px}.head:first-child{margin-top:0}label{display:block;margin:10px 0}.hash{font:11px/1.8 monospace;word-break:break-all;background:#f6f6f6;padding:8px;border-radius:6px}.foot{font-size:12px;color:#888;line-height:1.8;margin:15px 0}@media(max-width:760px){.layout{grid-template-columns:1fr}.art{height:460px}}</style><style>
/* V6: mobile-first layout */
:root{color-scheme:light}*{box-sizing:border-box}body{overflow-x:hidden}main{width:100%;max-width:1180px;margin:0 auto;padding:20px 16px 32px}h1{font-size:clamp(27px,6vw,36px);margin:8px 0 14px}.entry{margin:0 0 14px;gap:8px}.entry input{font-size:16px;min-height:48px}.entry .primary{min-width:82px;padding:12px 18px}.layout{grid-template-columns:1fr;gap:12px}.art{height:auto;aspect-ratio:1/1;min-height:310px;border-radius:16px}.history-controls{top:10px;right:10px}.history-controls button{padding:8px;font-size:12px}.zoom-controls{right:12px;bottom:12px}.zoom-controls button{width:44px;height:44px}.side{padding:18px;border-radius:16px}.side button{min-height:44px}.side input[type=range]{height:34px}.colors input{height:44px}.status{max-width:62%;font-size:11px}.head{margin-top:18px}.foot{font-size:12px}

@media(max-width:380px){main{padding:14px 10px}.art{min-height:290px}.entry .primary{min-width:70px;padding:10px}.history-controls button{font-size:11px}}
</style><main><h1>无限的一隅</h1><div class="entry"><input id="phrase" value="希望我们能一起看很多次日落。" placeholder="输入一句话"><button class="primary" id="generate">生成</button></div><div class="layout"><div class="art"><canvas id="canvas"></canvas><div class="status" id="status">生成中</div><div class="history-controls"><button id="undo" title="撤销上一次修改">↶ 撤销</button><button id="redo" title="重做上一次修改">↷ 重做</button></div><div class="zoom-controls"><button id="minus" title="缩小">−</button><button id="plus" title="放大">+</button></div></div><aside class="side"><div class="head">密铺范围</div><div class="range-head"><span class="muted">范围层级</span><b id="levelText">12</b></div><input id="level" type="range" min="5" max="30" value="12" step="1"><div class="muted">5 — 30 · 调整后自动居中适配</div><div class="head">菱形颜色</div><div class="colors"><label>厚菱形<input type="color" id="thick" value="#d8b58d"></label><label>薄菱形<input type="color" id="thin" value="#88aaa2"></label></div><button id="seedColors">↺ 重置为原始配色</button><button id="randomColors">⤨ 随机颜色</button><div class="head">边界</div><label><input type="radio" name="edge" value="none"> 无边界</label><label><input type="radio" name="edge" value="line" checked> 显示边界</label><div class="head">导出</div><button id="png">↓ 导出图像 PNG</button><button id="svg">↓ 导出 SVG（嵌入图像）</button><button id="hashButton">↓ 导出哈希值</button><div class="head">SHA-256</div><div id="hash" class="hash">—</div><div class="head">视角</div><button id="reset">重置视角</button><div class="foot">右下角 + / − 缩放，画面自动居中</div></aside></div><div class="foot">数学构造：de Bruijn 五重网格；文字 SHA-256 决定五个网格的相位偏移（总和为零）。滑块控制可见范围（5–30）；哈希也确定两类菱形的初始颜色，颜色可以手动调整。原始配色由哈希连续映射到受约束的低饱和 OKLCH 色域；只有点击“随机颜色”才会从20组精选配色中抽取。</div></main><script>
const $=x=>document.getElementById(x),c=$('canvas'),g=c.getContext('2d'),V=Array.from({length:5},(_,i)=>[Math.cos(2*Math.PI*i/5),Math.sin(2*Math.PI*i/5)]);let phase=[],tiles=[],hash='',level=12,mode='line',scale=20,offset=[0,0],palette=['#d8b58d','#88aaa2'],history=[],historyIndex=-1,restoring=false,hashBytes=[];const cross=(a,b)=>a[0]*b[1]-a[1]*b[0];function point(k){let x=0,y=0;for(let j=0;j<5;j++){x+=k[j]*V[j][0];y+=k[j]*V[j][1]}return[x,y]}
async function digest(s){let data=new TextEncoder().encode(s);if(crypto.subtle)return [...new Uint8Array(await crypto.subtle.digest('SHA-256',data))];return sha256(data)}
function sha256(data){let primes=[],n=2;while(primes.length<64){let ok=true;for(let p of primes){if(p*p>n)break;if(n%p===0){ok=false;break}}if(ok)primes.push(n);n++}const frac=x=>((x-Math.floor(x))*4294967296)>>>0,K=primes.map(p=>frac(Math.cbrt(p))),h=primes.slice(0,8).map(p=>frac(Math.sqrt(p)));let m=new Uint8Array(Math.ceil((data.length+9)/64)*64);m.set(data);m[data.length]=128;let bits=data.length*8;for(let i=0;i<8;i++)m[m.length-1-i]=Math.floor(bits/2**(8*i))&255;const rr=(x,n)=>(x>>>n)|(x<<(32-n));for(let pos=0;pos<m.length;pos+=64){let w=new Uint32Array(64);for(let i=0;i<16;i++){let j=pos+i*4;w[i]=(m[j]<<24)|(m[j+1]<<16)|(m[j+2]<<8)|m[j+3]}for(let i=16;i<64;i++){let a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))>>>0}let[a,b,d,e,f,j,k,z]=h;for(let i=0;i<64;i++){let t1=(z+(rr(f,6)^rr(f,11)^rr(f,25))+((f&j)^(~f&k))+K[i]+w[i])>>>0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&d)^(b&d)))>>>0;z=k;k=j;j=f;f=(e+t1)>>>0;e=d;d=b;b=a;a=(t1+t2)>>>0}let q=[a,b,d,e,f,j,k,z];for(let i=0;i<8;i++)h[i]=(h[i]+q[i])>>>0}return h.flatMap(x=>[(x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255])}
function build(radius){let out=[],N=radius+6;for(let a=0;a<5;a++)for(let b=a+1;b<5;b++){let va=V[a],vb=V[b],den=cross(va,vb);for(let ia=-N;ia<=N;ia++)for(let ib=-N;ib<=N;ib++){let A=ia-phase[a],B=ib-phase[b],x=(A*vb[1]-B*va[1])/den,y=(va[0]*B-vb[0]*A)/den;if(Math.hypot(x,y)>radius+4)continue;let k=V.map((v,j)=>j===a?ia:j===b?ib:Math.ceil(x*v[0]+y*v[1]+phase[j]-1e-10));let base=point(k),pa=V[a],pb=V[b],center=[base[0]+(pa[0]+pb[0])/2,base[1]+(pa[1]+pb[1])/2];if(Math.hypot(...center)>radius+1)continue;out.push({poly:[base,[base[0]+pa[0],base[1]+pa[1]],[base[0]+pa[0]+pb[0],base[1]+pa[1]+pb[1]],[base[0]+pb[0],base[1]+pb[1]]],type:Math.min(b-a,5-(b-a))===2?1:0})}}return out}
// 精选低饱和色组；两色通过明度和色相同时建立视觉层次。
const CURATED_PALETTES=[
 ['#D9BFA5','#527C88'],['#D8C6AE','#5E7890'],['#E0C4BB','#607F78'],['#D8CBAA','#6A7795'],
 ['#C9D6CF','#A76D70'],['#DDD0C0','#657E79'],['#DCC8D5','#637F91'],['#D9D4B9','#876E8D'],
 ['#D8C5AD','#647D6C'],['#D4CEDD','#9B765F'],['#CAD9DA','#A8756B'],['#E0D0C3','#607C95'],
 ['#D5D7B9','#98728B'],['#E0C7A7','#687A91'],['#D7C8C3','#678A82'],['#C9D2DD','#9B765E'],
 ['#D8D6CC','#806D94'],['#D9C3C6','#5E8586'],['#C8D7C5','#98777D'],['#DCCFBB','#617B8B']
];
// 将哈希连续映射到受约束的 OKLCH 色域，而非离散色卡。
// 颜色 A: 高明度、低彩度；颜色 B: 中低明度、低彩度且色相分离。
// 每个通道使用独立的哈希位，映射后才量化到 8-bit sRGB。
function u32(b,i){return ((b[i]*16777216+b[i+1]*65536+b[i+2]*256+b[i+3])>>>0)/4294967296}
function oklchRgb(L,C,H){let a=C*Math.cos(H*Math.PI/180),b=C*Math.sin(H*Math.PI/180);
 let l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.291485548*b)**3;
 let r=4.0767416621*l-3.3077115913*m+.2309699292*s,g=-1.2684380046*l+2.6097574011*m-.3413193965*s,bl=-.0041960863*l-.7034186147*m+1.7076147010*s;
 return [r,g,bl]}
function toHex(L,C,H){let rgb=oklchRgb(L,C,H);if(rgb.some(v=>v<0||v>1)){let lo=0,hi=C;for(let i=0;i<18;i++){let mid=(lo+hi)/2;if(oklchRgb(L,mid,H).every(v=>v>=0&&v<=1))lo=mid;else hi=mid}rgb=oklchRgb(L,lo,H)}
 const encode=v=>Math.round(255*(v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055)).toString(16).padStart(2,'0');return '#'+rgb.map(v=>encode(Math.min(1,Math.max(0,v)))).join('').toUpperCase()}
function deriveColors(b){let h1=360*u32(b,20),sep=105+75*u32(b,24),dir=b[31]&1?1:-1;
 let L1=.79+.08*u32(b,4),C1=.035+.045*u32(b,8);
 let L2=.48+.105*u32(b,12),C2=.04+.055*u32(b,16);
 return [toHex(L1,C1,h1),toHex(L2,C2,(h1+dir*sep+360)%360)]}

function render(context,w,h,S=scale,O=offset,M=mode){context.fillStyle='#fff';context.fillRect(0,0,w,h);for(let t of tiles){let p=t.poly.map(v=>[w/2+(v[0]-O[0])*S,h/2+(v[1]-O[1])*S]);context.beginPath();context.moveTo(...p[0]);for(let i=1;i<4;i++)context.lineTo(...p[i]);context.closePath();context.fillStyle=palette[t.type?1:0];context.fill();if(M==='line'){context.strokeStyle='#fff';context.lineWidth=Math.max(.5,S*.045);context.stroke()}}}
function draw(){render(g,c.clientWidth,c.clientHeight);$('status').textContent=`${tiles.length.toLocaleString()} 块菱形 · 范围 ${level}`;$('levelText').textContent=level}
function resize(){let d=Math.min(devicePixelRatio||1,2);c.width=Math.round(c.clientWidth*d);c.height=Math.round(c.clientHeight*d);g.setTransform(d,0,0,d,0,0);fit()}
function fit(){scale=Math.min(c.clientWidth,c.clientHeight)/(level*2.55);offset=[0,0];draw()}
function snapshot(){return {level,mode,palette:[...palette]}}
function record(){if(restoring)return;history=history.slice(0,historyIndex+1);history.push(snapshot());historyIndex=history.length-1;updateHistory()}
function updateHistory(){$('undo').disabled=historyIndex<=0;$('redo').disabled=historyIndex>=history.length-1}
function restore(s){restoring=true;level=s.level;mode=s.mode;palette=[...s.palette];$('level').value=level;$('thick').value=palette[0];$('thin').value=palette[1];document.querySelector(`input[name=edge][value="${mode}"]`).checked=true;tiles=build(level);fit();restoring=false;updateHistory()}
function changeLevel(n){level=n;tiles=build(level);fit();record()}
function download(blob,ext){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='penrose-'+hash.slice(0,12)+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function generate(){let b=await digest($('phrase').value);hashBytes=b;hash=b.map(x=>x.toString(16).padStart(2,'0')).join('');$('hash').textContent=hash;let a=Array.from({length:5},(_,i)=>{let j=i*4;return .1+.8*((b[j]*16777216+b[j+1]*65536+b[j+2]*256+b[j+3])/4294967296)}),avg=a.reduce((x,y)=>x+y)/5;phase=a.map(x=>x-avg);palette=deriveColors(b);$('thick').value=palette[0];$('thin').value=palette[1];level=+$('level').value;tiles=build(level);fit();history=[];historyIndex=-1;record()}
$('generate').onclick=generate;$('phrase').onkeydown=e=>{if(e.key==='Enter')generate()};
$('level').addEventListener('input',e=>{level=+e.target.value;tiles=build(level);fit()});$('level').addEventListener('change',()=>record());
document.querySelectorAll('input[name=edge]').forEach(e=>e.onchange=()=>{mode=e.value;draw();record()});
for(let [id,i] of [['thick',0],['thin',1]]){$(id).addEventListener('input',e=>{palette[i]=e.target.value;draw()});$(id).addEventListener('change',()=>record())}
$('seedColors').onclick=()=>{palette=deriveColors(hashBytes);$('thick').value=palette[0];$('thin').value=palette[1];draw();record()};
$('randomColors').onclick=()=>{let idx=crypto.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]%CURATED_PALETTES.length:Math.floor(Math.random()*CURATED_PALETTES.length);if(CURATED_PALETTES.length>1&&palette.join()===CURATED_PALETTES[idx].join())idx=(idx+1)%CURATED_PALETTES.length;palette=[...CURATED_PALETTES[idx]];$('thick').value=palette[0];$('thin').value=palette[1];draw();record()};
$('undo').onclick=()=>{if(historyIndex>0)restore(history[--historyIndex])};$('redo').onclick=()=>{if(historyIndex<history.length-1)restore(history[++historyIndex])};
$('plus').onclick=()=>{scale*=1.25;draw()};$('minus').onclick=()=>{scale/=1.25;draw()};$('reset').onclick=fit;
$('png').onclick=()=>{let out=document.createElement('canvas');out.width=out.height=2400;render(out.getContext('2d'),2400,2400,2400/(level*2.55),[0,0],mode);out.toBlob(b=>download(b,'png'))};
$('hashButton').onclick=()=>download(new Blob([JSON.stringify({algorithm:'SHA-256 + de Bruijn pentagrid v5 / OKLCH constrained hash palette',text:$('phrase').value,hash,phase,palette,level},null,2)],{type:'application/json'}),'json');
$('svg').onclick=()=>{let out=document.createElement('canvas');out.width=out.height=2400;render(out.getContext('2d'),2400,2400,2400/(level*2.55),[0,0],mode);let data=out.toDataURL('image/png');let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2400" viewBox="0 0 2400 2400"><image width="2400" height="2400" href="${data}"/></svg>`;download(new Blob([svg],{type:'image/svg+xml'}),'svg')};
new ResizeObserver(resize).observe(c);generate();</script></html>
